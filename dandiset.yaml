description: This dataset contains chronic neurochemical and electrophysiological
  recordings from the striatum of two adult female rhesus monkeys (Macaca mulatta;
  Monkey P and Monkey T), obtained with shaft-assisted micro-invasive probes (s-µIPs)
  and collected by the Schwerdt Lab at the University of Pittsburgh. It includes the
  processed data published on Zenodo (https://doi.org/10.5281/zenodo.14826579) together
  with the raw recordings from which they were derived. Recordings were made while
  the monkeys performed reward-biased eye movement tasks, in which the animal fixates
  a central cue, is shown a value cue signaling a large or small reward, and makes
  a saccade to a left or right target to obtain reward; trials include forced and
  free-choice conditions. Electrophysiology was acquired with a Neuralynx Digital
  Lynx SX system through a unity-gain headstage (HS-36, ±1 mV input range) at 30 kHz
  (Monkey P) or 32 kHz (Monkey T), bandpass filtered 0.1–7500 Hz. FSCV was performed
  with a triangular waveform (−0.35 to 1.34 V, 400 V/s) applied at 10 Hz, with current
  sampled at 25 kHz. For Monkey P (session 08/13/2018), the dataset includes raw broadband
  electrophysiology from striatal site cl3, spike-sorted units from Plexon Offline
  Sorter, and threshold-detected spikes with 48-sample waveforms. For Monkey T, session
  09/13/2024 includes raw FSCV current and applied voltage from site c8dg together
  with trial-aligned, PCA-extracted dopamine, pH, motion, and oxidation current (at
  0.6 V) time series (10 Hz, 60 s per trial); session 09/26/2024 includes raw broadband
  electrophysiology from sites c3bs and c3a and a bipolar beta-band LFP (c3bs referenced
  to c3a, 1 kHz, 60 s per trial centered on initial cue onset). Behavioral data are
  stored as a trials table with trial types and an annotated events table of task
  events (e.g., fixation onset, value cue onset, reward delivery, and error types)
  decoded from 8-bit Neuralynx event codes. The Neuralynx and FSCV systems were synchronized
  using shared trial-start event codes sent to both systems, and all data are expressed
  relative to the start of the Neuralynx recording.
